<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Какой сайт нужен салону «Кима»</title>
<meta name="description" content="Выберите дизайн, запись и функции для сайта салона и отправьте выбор в WhatsApp.">
<meta name="theme-color" content="#F7F2EA">
<meta property="og:title" content="Какой сайт нужен салону «Кима»">
<meta property="og:description" content="Варианты дизайна, записи и функций на фото ваших работ.">
<meta property="og:image" content="https://webdesign321321.github.io/salon-kima-shakhtinsk/og.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='26' fill='%232B211B'/%3E%3Ctext x='50' y='68' font-family='Georgia' font-size='58' font-style='italic' fill='%23D6B57C' text-anchor='middle'%3EК%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Golos+Text:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Unbounded:wght@600;800;900&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#F7F2EA; --cream:#EFE6D8; --sand:#E2D3BE; --line:rgba(43,33,27,.14); --espresso:#2B211B; --cocoa:#6B5646; --muted:#8C7A6B;
  --gold:#B08A52; --gold2:#D6B57C; --white:#FFFDF9; --wa:#1FA855;
  --serif:'Playfair Display',Georgia,serif; --sans:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ivory);color:var(--espresso);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body{min-height:100svh}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
textarea{font:inherit}
[hidden]{display:none!important}

/* ===== оболочка теста ===== */
.bar{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:linear-gradient(var(--ivory) 72%,rgba(247,242,234,0))}
.brand{display:flex;align-items:baseline;gap:10px;font-size:14px;color:var(--cocoa)}
.brand b{font-family:var(--serif);font-style:italic;font-weight:500;font-size:22px;letter-spacing:0;text-transform:none;color:var(--espresso)}
.back{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:background .25s,opacity .25s}
.back svg{width:18px;height:18px}
.back.off{opacity:0;pointer-events:none}
.ring{position:relative;width:46px;height:46px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:2}
.ring .tr{stroke:var(--line)}
.ring .pg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .6s var(--ease)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--cocoa)}
.app{position:relative;z-index:2;min-height:100svh}
.scr{min-height:100svh;padding:84px 18px 32px;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1180px;margin-inline:auto}
.eyebrow{display:inline-block;font-size:14px;color:var(--cocoa);font-weight:500}
.h1{font-family:var(--serif);font-weight:400;font-size:clamp(44px,12vw,96px);line-height:.98;letter-spacing:-.02em;margin:18px 0 0}
.h1 em,.h2 em{font-style:normal;color:inherit}
.h2{font-family:var(--serif);font-weight:400;font-size:clamp(26px,6.6vw,52px);line-height:1.05;letter-spacing:-.015em;margin:10px 0 0}
.sub{font-size:16px;line-height:1.55;color:var(--cocoa);max-width:560px;margin:10px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:56px;padding:0 28px;border-radius:999px;background:var(--espresso);color:var(--ivory);font-weight:600;font-size:16px;transition:transform .25s var(--ease),opacity .25s;text-align:center}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px;flex:none}
.btn.big{min-height:64px;padding:0 38px;font-size:18px}
.btn.wa{background:var(--wa);color:#fff}
.btn.ghost{background:transparent;color:var(--espresso);border:1px solid var(--line)}
.foot{margin-top:auto;padding-top:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.hint{font-size:13px;color:var(--muted)}

.intro-grid{display:grid;gap:28px;align-items:center;flex:1}
.fan{position:relative;height:clamp(290px,80vw,470px);max-width:450px;width:100%;justify-self:center}
.fan figure{position:absolute;margin:0;width:54%;aspect-ratio:3/4;border-radius:200px 200px 22px 22px;overflow:hidden;box-shadow:0 30px 60px -28px rgba(43,33,27,.45);border:6px solid var(--white)}
.fan figure img{width:100%;height:100%;object-fit:cover}
.fan .f1{left:0;top:12%;transform:rotate(-8deg)}
.fan .f2{left:23%;top:0;z-index:2}
.fan .f3{right:0;top:14%;transform:rotate(8deg)}

/* телефон */
/* ширина считается из высоты явно: у aspect-ratio ширина росла из-за неразрывных строк и лент внутри мини-сайтов */
.phone{--ph:clamp(420px,62svh,600px);position:relative;flex:none;min-width:0;height:var(--ph);width:calc(var(--ph) * .4787);border-radius:40px;background:#16110e;padding:9px;box-shadow:0 44px 70px -38px rgba(43,33,27,.6),inset 0 0 0 1.5px #3a302a}
.phone::before{content:"";position:absolute;left:50%;top:16px;width:66px;height:18px;margin-left:-33px;border-radius:20px;background:#16110e;z-index:9}
.phone .scroll{position:relative;width:100%;height:100%;border-radius:32px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;background:#fff;overscroll-behavior:contain}
.phone .scroll::-webkit-scrollbar{display:none}

/* шаг 1 — карусель дизайнов */
.dcar{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px 18px 8px;margin:6px -18px 0;scrollbar-width:none}
.dcar::-webkit-scrollbar{display:none}
.dcard{scroll-snap-align:center;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:12px;width:min(84vw,330px)}
.dcard .phone{transition:box-shadow .3s,transform .3s var(--ease)}
.dcard[aria-selected="true"] .phone{box-shadow:0 0 0 3px var(--ivory),0 0 0 6px var(--gold),0 44px 70px -38px rgba(43,33,27,.6)}
.dcard .meta{text-align:center;max-width:300px}
.dcard .meta b{display:block;font-family:var(--serif);font-weight:500;font-size:24px}
.dcard .meta span{display:block;font-size:13.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.pick{min-height:46px;padding:0 22px;border-radius:999px;border:1px solid var(--espresso);font-weight:600;font-size:14px;transition:background .3s,color .3s}
.dcard[aria-selected="true"] .pick{background:var(--espresso);color:var(--ivory)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--sand);transition:background .3s,width .3s}
.dots i.on{background:var(--espresso);width:20px;border-radius:9px}

/* шаги 2–3 */
.bld{display:grid;gap:8px;flex:1;align-content:start}
.bld>*{min-width:0}
.stage{position:sticky;top:66px;z-index:6;display:flex;justify-content:center;padding:6px 0 12px;background:linear-gradient(var(--ivory) 90%,rgba(247,242,234,0))}
.bld .phone{--ph:clamp(330px,50svh,600px)}
.q-ctl{display:flex;flex-direction:column}
.bopts{display:grid;gap:10px;margin-top:6px}
.bopt{display:flex;gap:14px;align-items:center;text-align:left;padding:12px 44px 12px 12px;background:var(--white);border:1px solid var(--line);border-radius:18px;position:relative;transition:background .3s,color .3s,border-color .3s}
.bopt .ic{width:44px;height:44px;border-radius:12px;background:var(--cream);display:grid;place-items:center;flex:none}
.bopt .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bopt b{display:block;font-size:16px}
.bopt small{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
.bopt::after{content:"";position:absolute;right:14px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;border:1px solid var(--line)}
.bopt[aria-pressed="true"]{background:var(--espresso);color:var(--ivory);border-color:var(--espresso)}
.bopt[aria-pressed="true"] small{color:rgba(247,242,234,.65)}
.bopt[aria-pressed="true"] .ic{background:rgba(214,181,124,.2);color:var(--gold2)}
.bopt[aria-pressed="true"]::after{background:var(--gold2);border-color:var(--gold2);box-shadow:inset 0 0 0 5px var(--espresso)}
.tip{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--cocoa);background:var(--cream);border-radius:12px;padding:10px 12px;margin-top:8px}
.feats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:6px}
.ft{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px 12px 12px;background:var(--white);border:1px solid var(--line);border-radius:16px;min-width:0;transition:background .3s,color .3s,border-color .3s}
.ft b{font-size:14px;line-height:1.2;padding-right:22px}
.ft small{font-size:12px;color:var(--muted);line-height:1.3}
.ft::after{content:"+";position:absolute;right:10px;top:10px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:14px;line-height:1}
.ft[aria-pressed="true"]{background:var(--espresso);color:var(--ivory);border-color:var(--espresso)}
.ft[aria-pressed="true"] small{color:rgba(247,242,234,.6)}
.ft[aria-pressed="true"]::after{content:"✓";background:var(--gold2);border-color:var(--gold2);color:var(--espresso);font-size:11px}

/* итог */
.fin{display:grid;gap:22px;flex:1}
.fin>*{min-width:0}
.sum{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:14px 18px}
.sum .r{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sum .r:last-child{border-bottom:0}
.sum dt{font-size:12px;color:var(--muted)}
.sum dd{margin:2px 0 0;font-weight:600;font-size:15px;line-height:1.35}
.sum .ed{font-size:13px;color:var(--gold);font-weight:600;padding:8px 0 8px 10px}
.wish{width:100%;min-height:84px;border-radius:18px;border:1px solid var(--line);background:var(--white);padding:14px;font-size:16px;resize:vertical;outline:none;color:var(--espresso)}
.wish:focus{border-color:var(--gold)}

@media (min-width:900px){
  .scr{padding:100px 40px 44px}
  .bar{padding:18px 40px}
  .intro-grid{grid-template-columns:1.1fr .9fr}
  .dcar{margin:14px 0 0;padding:18px 4px 10px;justify-content:flex-start}
  .dcard{width:300px}
  .bld{grid-template-columns:auto 1fr;grid-template-areas:"stage head" "stage ctl";column-gap:64px;row-gap:0;align-content:center}
  .q-head{grid-area:head;align-self:end}
  .q-ctl{grid-area:ctl;align-self:start}
  .stage{grid-area:stage;position:sticky;top:96px;background:none;padding:0}
  .bld .phone{--ph:min(640px,76svh)}
  .feats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fin{grid-template-columns:auto 1fr;column-gap:56px;align-items:start}
  .fin .phone{--ph:min(680px,80svh)}
}
.still *{animation:none!important;transition:none!important}

/* ================= МИНИ-САЙТЫ ================= */
.site{--bg:#F7F2EA;--fg:#2B211B;--acc:#B08A52;--card:#FFFDF9;--mut:#8C7A6B;--ln:rgba(43,33,27,.12);--h:'Playfair Display',Georgia,serif;--b:'Golos Text',system-ui,sans-serif;--hw:400;--rad:14px;--btnbg:#2B211B;--btnfg:#F7F2EA;--btnrad:999px;
  position:relative;min-height:100%;background:var(--bg);color:var(--fg);font-family:var(--b);font-size:11px;line-height:1.45}
.site *{box-sizing:border-box}
.site img{width:100%;height:100%;object-fit:cover;display:block}
.site button{font:inherit;color:inherit}
.site .sec{padding:24px 16px}
.site .st{margin-bottom:12px}
.site .st .n{display:none}
.site .st .kk{display:block;font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);font-weight:700}
.site .st h4{margin:4px 0 0;font-family:var(--h);font-weight:var(--hw);font-size:22px;line-height:1.05}
.site .st h4 em{font-style:italic;color:var(--acc)}
.site .b2{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 16px;border-radius:var(--btnrad);background:var(--btnbg);color:var(--btnfg);font-weight:700;font-size:10.5px;cursor:pointer}
.site .b2.wa{background:#1FA855;color:#fff}
.site .b2 svg{width:13px;height:13px}
.site .b2.full{width:100%}
.site .cardx{background:var(--card);border:1px solid var(--ln);border-radius:var(--rad);padding:12px}
.site .chips{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0 10px}
.site .chip{padding:6px 10px;border-radius:99px;border:1px solid var(--ln);font-size:9.5px;font-weight:600;background:transparent;cursor:pointer;transition:background .2s,color .2s}
.site .chip.on{background:var(--btnbg);color:var(--btnfg);border-color:var(--btnbg)}
.site .lb{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
.site .muted{color:var(--mut)}
.site .note{font-size:8.5px;color:var(--mut);margin:6px 0 0}
.site .done{display:none;margin-top:8px;padding:9px 10px;border-radius:10px;background:rgba(31,168,85,.12);color:#15803d;font-weight:600;font-size:10px}
.site .done.show{display:block}
.site .nav{position:sticky;top:0;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:30px 16px 10px;background:var(--bg)}
.site .nav .lg{font-family:var(--h);font-weight:var(--hw);font-size:16px}
.site .nav .nr{display:flex;align-items:center;gap:8px}
.site .burger{width:18px;height:9px;border-block:1.5px solid var(--fg)}
.site .lng{display:inline-flex;border:1px solid var(--ln);border-radius:99px;overflow:hidden}
.site .lng button{padding:3px 7px;font-size:8.5px;font-weight:700;cursor:pointer}
.site .lng button.on{background:var(--btnbg);color:var(--btnfg)}

/* функции (общие) */
.site .ba{position:relative;aspect-ratio:3/4;border-radius:var(--rad);overflow:hidden;--x:50%;touch-action:pan-y}
.site .ba>img,.site .ba .af img{position:absolute;inset:0}
.site .ba .af{position:absolute;inset:0;clip-path:inset(0 0 0 var(--x))}
.site .ba .hd{position:absolute;top:0;bottom:0;left:var(--x);width:2px;margin-left:-1px;background:#fff;pointer-events:none}
.site .ba .hd::after{content:"⟷";position:absolute;top:50%;left:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:#fff;color:#2B211B;display:grid;place-items:center;font-size:13px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.site .ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:ew-resize}
.site .ba .t,.site .shade .t{position:absolute;bottom:8px;padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;font-size:9px;pointer-events:none}
.site .shade{position:relative;aspect-ratio:4/5;border-radius:var(--rad);overflow:hidden}
.site .sws{display:flex;gap:8px;margin:10px 0 0;flex-wrap:wrap}
.site .sw{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:8.5px;cursor:pointer}
.site .sw i{width:28px;height:28px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--ln)}
.site .sw.on i{box-shadow:0 0 0 2px var(--fg)}
.site .tabs{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.site .tabs::-webkit-scrollbar{display:none}
.site .mw{display:none;grid-template-columns:repeat(3,1fr);gap:5px}
.site .mw.on{display:grid}
.site .mw div{aspect-ratio:3/4;border-radius:8px;overflow:hidden}
.site .mw p{grid-column:1/-1;margin:4px 0 0}
.site .rrow{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-right:-16px;padding-right:16px}
.site .rrow::-webkit-scrollbar{display:none}
.site .rv{flex:0 0 78%;scroll-snap-align:start;background:var(--card);border:1px solid var(--ln);border-radius:var(--rad);padding:12px}
.site .rv .s{color:var(--acc);letter-spacing:2px;font-size:10px}
.site .rv q{display:block;margin:6px 0;font-size:11.5px;line-height:1.35;quotes:"«" "»"}
.site .rv span{color:var(--mut);font-size:9px}
.site .school{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center}
.site .school .ph{aspect-ratio:3/4;border-radius:10px;overflow:hidden}
.site .cert{position:relative;border-radius:var(--rad);padding:16px;overflow:hidden;background:linear-gradient(135deg,var(--acc),#F0DDBE);color:#2B211B;margin-bottom:8px}
.site .cert b{display:block;font-family:var(--h);font-weight:var(--hw);font-size:18px;line-height:1.05}
.site .cert small{display:block;margin-top:4px;opacity:.75}
.site .cert::after{content:"";position:absolute;right:-26px;top:-26px;width:96px;height:96px;border-radius:50%;border:1px solid rgba(255,255,255,.6)}
.site .ig{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-bottom:10px}
.site .ig div{aspect-ratio:1;overflow:hidden}
.site .map{height:92px;border-radius:var(--rad);margin:10px 0;background:repeating-linear-gradient(35deg,var(--ln) 0 1px,transparent 1px 14px),repeating-linear-gradient(-55deg,var(--ln) 0 1px,transparent 1px 22px),var(--card);position:relative;border:1px solid var(--ln)}
.site .map::after{content:"";position:absolute;left:52%;top:36%;width:16px;height:16px;margin-left:-8px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--acc)}
.site .kv{display:grid;gap:6px}
.site .kv div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--ln);padding-bottom:6px}
.site .kv span{color:var(--mut)}
.site .open{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:9.5px}
.site .open i{width:7px;height:7px;border-radius:50%;background:#9ca3af}
.site .open.on i{background:#22c55e}
.site .fabw{position:sticky;bottom:12px;height:0;z-index:9;display:flex;justify-content:flex-end;padding-right:12px}
.site .fab{width:42px;height:42px;margin-top:-54px;border-radius:50%;background:#1FA855;color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px -6px rgba(0,0,0,.45)}
.site .fab svg{width:22px;height:22px}
.site .pr div{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln)}
.site .pr b{white-space:nowrap;color:var(--mut)}
.site .faq details{border-bottom:1px solid var(--ln);padding:9px 0}
.site .faq summary{display:flex;justify-content:space-between;gap:8px;font-weight:700;cursor:pointer;list-style:none}
.site .faq summary::-webkit-details-marker{display:none}
.site .faq summary::after{content:"+";color:var(--acc);font-weight:700}
.site .faq details[open] summary::after{content:"−"}
.site .faq p{margin:6px 0 0;color:var(--mut)}
.site .match .q{margin:0 0 6px;font-weight:700}
.site .match .res{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;margin-top:10px}
.site .match .res>div{min-width:0}
.site .match .res b{display:block}
.site .match .copts .chip{text-align:left}
.site .match .res .ph{aspect-ratio:3/4;border-radius:10px;overflow:hidden}
.d-classic .st .kk,.d-pop .st .kk{display:none}
/* запись */
.site .days{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin:5px 0 10px}
.site .days::-webkit-scrollbar{display:none}
.site .day{flex:0 0 40px;display:grid;justify-items:center;gap:1px;padding:6px 0;border-radius:10px;border:1px solid var(--ln);cursor:pointer;font-size:8.5px}
.site .day b{font-size:13px}
.site .day.on{background:var(--btnbg);color:var(--btnfg);border-color:var(--btnbg)}

      msgs.insertAdjacentHTML('beforeend', `<div class="bot">${q}</div>`);
      box.dataset.step = step + 1;
      box.querySelector('.copts').innerHTML = opts.length ? opts.map(s => `<button class="chip" data-act="chat">${s}</button>`).join('') : `<span class="b2 wa full">${waI}Открыть WhatsApp</span>`;
      if (G) gsap.from(msgs.querySelectorAll('div:nth-last-child(-n+2)'), { y: 8, opacity: 0, duration: .35, stagger: .25 });
    }
  });

  /* ---------- экраны теста ---------- */
  const STEPS = 3, FIN = 4;
  let cur = 0;
  function screenHTML(n) {
    if (n === 0) return `<div class="wrap intro-grid">
      <div><span class="eyebrow">Для салона «Кима»</span>
        <h1 class="h1">Какой сайт нужен вашему салону?</h1>
        <p class="sub">Здесь ${DESIGNS.length} вариантов дизайна, ${BOOK.length} способа записи и ${FEATS.length} функций. Всё на фото ваших работ, всё можно нажимать. Выберите, что нравится, и отправьте выбор в WhatsApp.</p>
        <div class="foot"><button class="btn big" data-next>Начать</button><span class="hint">3 шага, около 3 минут</span></div></div>
      <div class="fan"><figure class="f1"><img src="${img('blond-lob-3-sm.jpg')}" alt=""></figure><figure class="f2"><img src="${img('sunkissed-2-sm.jpg')}" alt=""></figure><figure class="f3"><img src="${img('beige-waves-1-sm.jpg')}" alt=""></figure></div></div>`;
    if (n === 1) return `<div class="wrap"><span class="eyebrow">Шаг 1 из 3</span><h2 class="h2">Выберите дизайн</h2><p class="sub">Листайте вбок. Каждый сайт можно прокрутить и понажимать.</p>
      <div class="dcar" id="dcar">${DESIGNS.map(([k, t, s]) => `<div class="dcard" data-d="${k}" aria-selected="${S.design === k}"><div class="phone"><div class="scroll" data-ph="${k}"></div></div><div class="meta"><b>${t}</b><span>${s}</span></div><button class="pick" data-choose="${k}">${S.design === k ? 'Выбран' : 'Выбрать'}</button></div>`).join('')}</div>
      <div class="dots" id="dots">${DESIGNS.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>
      <div class="foot"><button class="btn" data-next>${S.back ? 'Сохранить' : 'Дальше'}</button><span class="hint">Выбран: <b id="dsel">${DL[S.design]}</b></span></div></div>`;
    if (n === 2) return `<div class="wrap bld"><div class="q-head"><span class="eyebrow">Шаг 2 из 3</span><h2 class="h2">Как клиенты будут записываться?</h2><p class="sub">Попробуйте каждый вариант прямо в телефоне.</p></div>
      <div class="stage"><div class="phone"><div class="scroll" data-ph="main"></div></div></div>
      <div class="q-ctl"><div class="bopts">${BOOK.map(([k, t, s, ic]) => `<button class="bopt" data-book="${k}" aria-pressed="${S.book === k}"><span class="ic">${ic}</span><span><b>${t}</b><small>${s}</small></span></button>`).join('')}</div>
      <div class="tip">Кнопки в телефоне нажимаются, можно попробовать записаться</div>
      <div class="foot"><button class="btn" data-next>${S.back ? 'Сохранить' : 'Дальше'}</button></div></div></div>`;
    if (n === 3) return `<div class="wrap bld"><div class="q-head"><span class="eyebrow">Шаг 3 из 3</span><h2 class="h2">Что добавить на сайт?</h2><p class="sub">Самое нужное уже отмечено, так делают большинство салонов. Уберите лишнее или добавьте своё.</p></div>
      <div class="stage"><div class="phone"><div class="scroll" data-ph="main"></div></div></div>
      <div class="q-ctl"><div class="feats">${FEATS.map(([k, t, s]) => `<button class="ft" data-feat="${k}" aria-pressed="${!!S.f[k]}"><b>${t}</b><small>${s}</small></button>`).join('')}</div>
      <div class="foot"><button class="btn" data-next>${S.back ? 'Сохранить' : 'Посмотреть свой сайт'}</button></div></div></div>`;
    const fl = FEATS.filter(([k]) => S.f[k]).map(([, l]) => l).join(', ') || 'ничего не выбрано';
    const row = (dt, dd, step) => `<div class="r"><div><dt>${dt}</dt><dd>${dd}</dd></div><button class="ed" data-edit="${step}">Изменить</button></div>`;
    return `<div class="wrap fin">
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px"><div class="phone"><div class="scroll" data-ph="main"></div></div><span class="hint">Так будет выглядеть ваш сайт</span></div>
      <div style="display:grid;gap:14px;align-content:start">
        <div><span class="eyebrow">Готово</span><h2 class="h2">Ваш выбор</h2></div>
        <div class="sum"><dl style="margin:0">${row('Дизайн', DL[S.design], 1)}${row('Запись', BLb[S.book], 2)}${row('Функции', fl, 3)}</dl></div>
        <textarea class="wish" id="wish" placeholder="Пожелания: что добавить или убрать, какие фото поставить">${S.wish || ''}</textarea>
        <button class="btn wa" id="send">${waI}Отправить выбор в WhatsApp</button>
        <p class="hint" style="margin:0">Откроется WhatsApp с готовым сообщением, останется нажать «Отправить».</p>
        <button class="btn ghost" data-restart>Пройти заново</button>
      </div></div>`;
  }

  function progress(n) {
    const done = n === 0 ? 0 : n === FIN ? STEPS : n - 1, C = 2 * Math.PI * 20, pg = $('#ringPg');
    pg.style.strokeDasharray = C; pg.style.strokeDashoffset = C * (1 - done / STEPS);
    $('#ringTx').textContent = `${done}/${STEPS}`;
    $('#back').classList.toggle('off', n === 0);
  }
  function go(n, dir = 1) {
    const app = $('#app'), old = app.firstElementChild;
    const el = document.createElement('section'); el.className = 'scr'; el.innerHTML = screenHTML(n);
    const swap = () => { if (old) old.remove(); app.appendChild(el); scrollTo(0, 0); cur = n; progress(n); bind(el, n); save(); };
    if (G && old) gsap.to(old, { opacity: 0, x: -40 * dir, duration: .25, ease: 'power2.in', onComplete: () => { swap(); gsap.fromTo(el, { opacity: 0, x: 50 * dir }, { opacity: 1, x: 0, duration: .5, ease: 'power3.out', clearProps: 'transform' }); } });
    else swap();
  }
  function bind(el, n) {
    el.querySelectorAll('[data-next]').forEach(b => b.onclick = next);
    const main = el.querySelector('[data-ph="main"]');
    if (n === 0 && G) { gsap.from(el.querySelectorAll('.fan figure'), { y: 80, opacity: 0, duration: 1, stagger: .12, ease: 'expo.out' }); gsap.from(el.querySelectorAll('.h1,.sub,.foot'), { y: 24, opacity: 0, duration: .8, stagger: .08, ease: 'power3.out' }); }
    if (n === 1) {
      const demoF = { ba: true, shade: false, masters: true, match: false, price: false, reviews: true, faq: false, school: false, cert: false, insta: false, map: true, lang: false, fab: true };
      DESIGNS.forEach(([k]) => paint(el.querySelector(`[data-ph="${k}"]`), k, 'form', demoF, null));
      const car = el.querySelector('#dcar'), dots = [...el.querySelectorAll('#dots i')];
      car.addEventListener('scroll', () => { const cards = [...car.children]; const mid = car.scrollLeft + car.clientWidth / 2; let best = 0, bd = 1e9; cards.forEach((c, i) => { const d = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid); if (d < bd) { bd = d; best = i; } }); dots.forEach((d, i) => d.classList.toggle('on', i === best)); }, { passive: true });
      el.querySelectorAll('[data-choose]').forEach(b => b.onclick = () => {
        S.design = b.dataset.choose; save();
        el.querySelectorAll('.dcard').forEach(c => { const on = c.dataset.d === S.design; c.setAttribute('aria-selected', on); c.querySelector('.pick').textContent = on ? 'Выбран' : 'Выбрать'; });
        el.querySelector('#dsel').textContent = DL[S.design];
        if (G) gsap.fromTo(b.closest('.dcard').querySelector('.phone'), { scale: .96 }, { scale: 1, duration: .5, ease: 'back.out(3)' });
      });
      const sel = el.querySelector(`.dcard[data-d="${S.design}"]`);
      if (sel && sel.previousElementSibling) requestAnimationFrame(() => car.scrollLeft = sel.offsetLeft - (car.clientWidth - sel.offsetWidth) / 2);
    }
    if (n === 2) {
      paint(main, S.design, S.book, S.f, 'booking');
      el.querySelectorAll('[data-book]').forEach(b => b.onclick = () => { S.book = b.dataset.book; save(); el.querySelectorAll('[data-book]').forEach(x => x.setAttribute('aria-pressed', x === b)); paint(main, S.design, S.book, S.f, 'booking'); });
    }
    if (n === 3) {
      paint(main, S.design, S.book, S.f, null);
      el.querySelectorAll('[data-feat]').forEach(b => b.onclick = () => {
        const k = b.dataset.feat; S.f[k] = !S.f[k]; save(); b.setAttribute('aria-pressed', S.f[k]);
        paint(main, S.design, S.book, S.f, S.f[k] && !['lang', 'fab'].includes(k) ? k : null);
        if (k === 'lang' && S.f.lang) main.scrollTop = 0;
      });
    }
    if (n === FIN) {
      paint(main, S.design, S.book, S.f, null);
      el.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { S.back = true; save(); go(+b.dataset.edit, -1); });
      el.querySelector('#wish').oninput = e => { S.wish = e.target.value; save(); };
      el.querySelector('#send').onclick = send;
      el.querySelector('[data-restart]').onclick = () => { try { localStorage.removeItem(KEY); } catch (e) {} location.href = location.pathname; };
      if (G) gsap.from(el.querySelectorAll('.sum,.wish,#send'), { y: 24, opacity: 0, duration: .6, stagger: .08, ease: 'power3.out' });
    }
  }
  function next() { if (S.back && cur >= 1 && cur <= 3) { S.back = null; save(); return go(FIN); } go(Math.min(FIN, cur + 1)); }
  $('#back').onclick = () => { if (S.back && cur >= 1 && cur <= 3) { S.back = null; return go(FIN, -1); } go(Math.max(0, cur - 1), -1); };

  function buildMsg() {
    const on = FEATS.filter(([k]) => S.f[k]).map(([, l]) => l), off = FEATS.filter(([k]) => !S.f[k]).map(([, l]) => l);
    return ['Здравствуйте! Выбор сайта для салона «Кима»', '',
      `Дизайн: ${DL[S.design]}`,
      `Запись: ${BLb[S.book]}`, '',
      'Нужно на сайте:', ...(on.length ? on.map((l, i) => `${i + 1}. ${l}`) : ['ничего не выбрано']), '',
      `Не нужно: ${off.join(', ') || 'нет'}`,
      S.wish.trim() ? `\nПожелания: ${S.wish.trim()}` : null].filter(x => x !== null).join('\n');
  }
  function send() { const url = `https://wa.me/${VANTA_WA}?text=${encodeURIComponent(buildMsg())}`; if (matchMedia('(pointer: coarse)').matches) location.href = url; else window.open(url, '_blank', 'noopener'); }
  window.__kima = { S, buildMsg, go };

  if (P.has('go')) { if (P.get('design')) S.design = P.get('design'); if (P.get('book')) S.book = P.get('book'); if (P.get('all')) FEATS.forEach(([k]) => S.f[k] = true); go(+P.get('go')); }
  else { load(); S.back = null; go(0); }
})();
</script>
</body>
</html>
